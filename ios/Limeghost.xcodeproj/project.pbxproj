		AA0000000000000000000E01 /* Debug */ = {
			isa = XCBuildConfiguration;
			buildSettings = {
				/* Signing is off for the Simulator and on for a device, and the
				   `[sdk=iphonesimulator*]` condition is what keeps both true at
				   once. Unconditional `CODE_SIGNING_ALLOWED = NO` — what this
				   was until Task 9 — is correct for the Simulator and cannot
				   install on hardware, since an unsigned bundle has nothing for
				   iOS to trust. Conditioning it means CI still needs no signing
				   identity (the runner has none) while a device build signs
				   normally. `DEVELOPMENT_TEAM` is deliberately empty: a team
				   identifier belongs to the person holding the Apple ID, not in
				   a shared repository, and Xcode fills it in from whoever is
				   signed in. See docs/ios-browser-foundation.md for the steps. */
				"CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]" = NO;
				"CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]" = NO;
				CODE_SIGN_STYLE = Automatic;
				CURRENT_PROJECT_VERSION = 1;
				DEVELOPMENT_TEAM = "";
				ENABLE_TESTABILITY = YES;
				GENERATE_INFOPLIST_FILE = NO;
				INFOPLIST_FILE = Sources/Info.plist;
				MARKETING_VERSION = 1.0;
