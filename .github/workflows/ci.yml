name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate

  macos-browser:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos/LimeghostBrowser
    steps:
      - uses: actions/checkout@v4
      # Pinned so the toolchain cannot drift with the runner image. If this
      # Xcode leaves the macos-15 image, the step fails loudly and the pin
      # gets updated by hand — loud beats silent drift. Deliberately older
      # than local toolchains, so CI stays the stricter gate.
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift --version
      # No separate release build: build-macos-app.sh runs its own.
      - run: swift test
      - run: ./scripts/build-macos-app.sh
      - run: codesign --verify --deep --strict ../../dist/Limeghost.app
      - run: plutil -lint ../../dist/Limeghost.app/Contents/Resources/PrivacyInfo.xcprivacy

  # The point of the whole shared-layer plan: the door rule, the narrow-window
  # rule and the assistant's session cap are not "should also work on a
  # phone" — they run on one here. `LimeghostSharedLayer` (a shared scheme
  # committed at .swiftpm/xcode/xcshareddata/xcschemes/, since SwiftPM's own
  # per-product auto-generated schemes carry no test action at all — that is
  # the whole reason this job needs a checked-in scheme rather than naming a
  # product directly) builds and tests exactly four targets: `LimeghostCore`,
  # `LimeghostShared`, and their two test targets. `LimeghostBrowser` itself
  # (the executable) and `BrowserBehaviorTests` are not in that scheme's
  # build action at all — confirmed locally by reading xcodebuild's own
  # target-dependency-graph output — so they stay AppKit and stay Mac-only,
  # exactly as macos-browser above already exercises them.
  #
  # Since Task 9 this job also builds and tests the phone app itself, from the
  # same discovered simulator, so a change that compiles for the shared layer
  # and breaks the app is caught here rather than on somebody's device. The app
  # has no checked-in scheme: `ios/Limeghost.xcodeproj` carries no
  # xcshareddata/xcschemes at all, and `xcodebuild` autocreates a scheme per
  # target — verified by running this exact command against a copy holding only
  # the repository's tracked files, with a clean derived-data path, rather than
  # assumed, because a missing scheme fails CI with nothing in the diff to
  # explain it (the same hazard .gitignore's exceptions already guard against
  # for the shared-layer scheme). Signing stays off for the Simulator through an
  # `[sdk=iphonesimulator*]` condition in the project, so this runner needs no
  # identity; a device build signs automatically instead. Both are in
  # docs/ios-browser-foundation.md.
  ios-simulator:
    runs-on: macos-15
    defaults:
      run:
        working-directory: macos/LimeghostBrowser
    steps:
      - uses: actions/checkout@v4
      # Same pin as macos-browser and for the same reason: a loud failure
      # here beats the iOS platform silently drifting out from under this job.
      - run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - run: swift --version
      # Never a hard-coded simulator name or OS version: this runner's image
      # ships different runtimes than a developer's machine, so the device is
      # discovered here and the destination below is built from its UDID.
      - name: Pick an available iOS simulator
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(v['udid'] for k in d for v in d[k] if 'iPhone' in v['name']))")
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
      - run: >-
          xcodebuild test -scheme LimeghostSharedLayer
          -destination "platform=iOS Simulator,id=$SIM_UDID"
      # The app, on the same simulator this job already found. `working-directory`
      # overrides the job default above, because the Xcode project lives at
      # `ios/` while everything else in this job runs from the package.
      - name: Build and test the iOS app
        working-directory: ios
        run: >-
          xcodebuild test -scheme Limeghost
          -destination "platform=iOS Simulator,id=$SIM_UDID"

  cef-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Configure the isolated CEF contract only
        run: >-
          cmake -S chromium/cef-spike
          -B "$RUNNER_TEMP/limeghost-cef-contract"
          -G Xcode
          -DLIMEGHOST_CEF_VALIDATE_ONLY=ON
          -DPROJECT_ARCH="$(uname -m)"
      - name: Compile-check the Objective-C bridge boundary
        run: >-
          xcrun clang -fsyntax-only -x objective-c -fobjc-arc
          -isysroot "$(xcrun --sdk macosx --show-sdk-path)"
          chromium/cef-spike/include/LimeghostChromiumBridge.h
      - name: Explain configure-only result
        run: echo "CEF remains isolated; CI validates its boundary without downloading or integrating a runtime."
