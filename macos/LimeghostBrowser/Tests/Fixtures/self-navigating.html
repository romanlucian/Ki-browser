<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Limeghost Self Navigating Fixture</title>
  </head>
  <body>
    <p>This page sends the tab onward the moment it loads, the way a redirect or a single-page app does.</p>
    <script>
      // Starts a second navigation while the first is still settling. The
      // browser must let the newer one take over, or the tab loads forever.
      location.replace('index.html');
    </script>
  </body>
</html>
